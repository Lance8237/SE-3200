<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Random Dog Adopter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Random Dog Adopter</h1>
            <p>Click the button to meet a random dog, then adopt your favorites!</p>
        </header>
 
    <main>
        <div class="controls">
            <button id="generate-btn">Meet a Random Dog</button>
            <button id="clear-btn">Clear All</button>
        </div>
 
        <p id="message"></p>
        <p id="adopted-count">Dogs adopted: 0</p>
 
        <section id="dog-list"></section>
    </main>
 
    <script src="script.js"></script>
    </body>
</html>
