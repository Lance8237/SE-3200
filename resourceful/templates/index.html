
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>My Game Collection</h1>

    <h2>My Games</h2>
    <div id="games-list"></div>

    <h2 id="form-heading">Add a Game</h2>

    <form id="game-form">
        <input type="text" id="title" placeholder="Game Title" required>
        <input type="text" id="platform" placeholder="Platform" required>
        <input type="text" id="genre" placeholder="Genre" required>
        <input type="number" id="release_year" placeholder="Release Year" required>
        <input type="number" id="hours_played" placeholder="Hours Played" min="0" required>

        <button type="submit" id="submit-button">Add Game</button>
        <button type="button" id="cancel-button">Cancel</button>
    </form>

    <script src="/static/script.js"></script>

</body>
</html>
